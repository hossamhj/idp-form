<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Four Transitions</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=20260907192327">
<style>
.ladder{display:flex;align-items:stretch;gap:2px;margin-bottom:26px;flex-wrap:nowrap}
.rung{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 13px;min-width:0;flex:1 1 0}
.rung-l{font-family:'Playfair Display',serif;font-size:12px;font-weight:600;color:var(--gray)}
.rung-n{font-size:12.5px;font-weight:600;margin-top:3px;line-height:1.3}
.rung-c{font-size:9.5px;color:var(--gray);margin-top:4px;line-height:1.45}
.tr{flex:0 0 88px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  cursor:pointer;padding:6px;border-radius:11px;transition:.16s;text-decoration:none;color:inherit}
.tr:hover{background:#fff}
.tr.on{background:var(--navy);color:#fff}
.tr-a{font-size:15px;color:var(--gray);line-height:1}
.tr.on .tr-a{color:rgba(255,255,255,.6)}
.tr-c{font-family:'Playfair Display',serif;font-size:18px;font-weight:600;margin:4px 0 2px}
.tr-f{font-size:8px;letter-spacing:.05em;text-transform:uppercase;color:var(--gray);text-align:center;line-height:1.4}
.tr.on .tr-f{color:rgba(255,255,255,.65)}
.tr-k{font-size:8px;margin-top:5px;padding:2px 6px;border-radius:6px;font-weight:600;white-space:nowrap}

.big{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-bottom:16px}
.big-h{padding:24px 28px;background:var(--navy);color:#EDE9E2}
.big-c{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:rgba(237,233,226,.5)}
.big-t{font-family:'Playfair Display',serif;font-size:29px;font-weight:500;margin:7px 0 5px}
.big-k{font-size:13px;color:rgba(237,233,226,.68)}
.big-m{display:flex;gap:28px;margin-top:18px;padding-top:16px;border-top:1px solid rgba(237,233,226,.16);flex-wrap:wrap}
.bm-v{font-family:'Playfair Display',serif;font-size:21px;font-weight:600}
.bm-l{font-size:9px;color:rgba(237,233,226,.5);letter-spacing:.07em;text-transform:uppercase;margin-top:3px}
.big-b{padding:24px 28px}

.blk{margin-bottom:26px}
.blk-t{font-family:'Playfair Display',serif;font-size:17px;font-weight:500;margin-bottom:4px}
.blk-s{font-size:11.5px;color:var(--gray);line-height:1.7;margin-bottom:13px}
.shift{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.shift-x{background:#F7F5F1;border:1px solid var(--line);border-radius:9px;padding:9px 14px;font-size:12.5px;font-style:italic}

.fgrp{border:1px solid var(--line);border-radius:12px;margin-bottom:10px;overflow:hidden}
.fgrp-h{padding:12px 15px;background:#FCFBF9;display:flex;align-items:center;gap:10px;cursor:pointer}
.fdot{width:10px;height:10px;border-radius:3px;flex-shrink:0}
.fgrp-n{font-size:13.5px;font-weight:600}
.fgrp-c{margin-left:auto;font-family:'Playfair Display',serif;font-size:19px;font-weight:600}
.fgrp-b{padding:0 15px 13px;display:none}
.fgrp.open .fgrp-b{display:block}
.fgrp-d{font-size:11.5px;color:var(--gray);line-height:1.7;padding:11px 0;border-top:1px solid #F0EDE7;margin-bottom:8px}
.fn{display:flex;align-items:center;gap:10px;padding:7px 11px;border:1px solid #EDEAE4;border-radius:8px;margin-bottom:4px;background:#FCFBF9;font-size:12px}
.fn-t{margin-left:auto;font-size:9.5px;font-family:ui-monospace,monospace;color:var(--gray);background:#F2EFE9;padding:2px 7px;border-radius:5px;white-space:nowrap}
.fn-w{font-size:10px;color:#7A4A05;background:#FEF6E7;padding:2px 7px;border-radius:5px;white-space:nowrap}

.q{border:1px solid var(--line);border-radius:12px;margin-bottom:11px;overflow:hidden;background:#fff}
.q-h{padding:13px 16px;background:#FCFBF9;display:flex;align-items:center;gap:12px;cursor:pointer;transition:.15s}
.q-h:hover{background:#F7F4EF}
.q.open .q-h{background:#fff;border-bottom:1px solid #F0EDE7}
.q-tag{width:36px;height:36px;border-radius:10px;background:#F2EFE9;color:#5A5750;display:flex;align-items:center;justify-content:center;font-family:'Playfair Display',serif;font-size:14px;font-weight:600;flex-shrink:0}
.q.open .q-tag{background:var(--navy);color:#fff}
.q-g{font-size:14px;font-weight:600;line-height:1.4}
.q-p{font-size:10.5px;color:var(--gray);margin-top:3px}
.q-chev{color:var(--gray);font-size:11px;flex-shrink:0;padding-left:10px;transition:transform .18s}
.q.open .q-chev{transform:rotate(180deg)}
.q-b{padding:13px 16px;display:none}
.q.open .q-b{display:block}
.q-lbl{font-size:9px;color:var(--gray);letter-spacing:.06em;text-transform:uppercase;margin-bottom:8px}
.q-chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.q-chip{font-size:11px;background:#F2EFE9;border-radius:7px;padding:4px 10px}
.mo{display:grid;grid-template-columns:44px 1fr;gap:11px;padding:7px 0;border-top:1px dashed #EDEAE4;font-size:12px}
.mo-m{font-weight:600;color:#6A6760;font-size:11px}
.mo-t{line-height:1.65}
.mile{margin-top:11px;padding:9px 12px;background:#E1F5EE;border-radius:8px;font-size:11.5px;color:#085041;line-height:1.6}

table.t{width:100%;border-collapse:collapse;font-size:12.5px}
table.t th{text-align:left;font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--gray);font-weight:600;padding:0 11px 8px 0;border-bottom:1px solid var(--line)}
table.t td{padding:10px 11px 10px 0;border-bottom:1px solid #EAE6DE;vertical-align:top;line-height:1.65}
table.t tr:last-child td{border:none}
ul.tight{list-style:none}
ul.tight li{font-size:12.5px;line-height:1.9;padding-left:18px;position:relative}
ul.tight li:before{content:'';position:absolute;left:2px;top:11px;width:5px;height:5px;border-radius:50%;background:var(--gray)}
.warn{background:#FDEEEA;border:1px solid #EFB5A2;border-radius:11px;padding:15px 17px;font-size:12.5px;line-height:1.75;color:#5A3128}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.exmp{border:1px solid #B7E3D3;background:#F5FBF9;border-radius:11px;padding:13px 15px;margin-bottom:14px}
.exmp-t{font-size:9.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#0A5540;margin-bottom:10px}
.exmp-r{display:grid;grid-template-columns:150px 1fr;gap:11px;padding:7px 0;border-top:1px solid #DDF0E8;font-size:12px;line-height:1.7}
.exmp-r>span{font-size:10.5px;color:#5A7A70}
.exmp-r.key>span{color:#0A5540;font-weight:600}
.exmp-r.key>div{color:#0A5540;font-weight:500}
.exmp-x{font-size:10.5px;color:#5A7A70;margin-top:11px;padding-top:9px;border-top:1px dashed #DDF0E8;line-height:1.7}
.scdef{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:15px}
.scd{border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:11px;line-height:1.6}
.scd b{font-size:12px;display:inline}
.scd i{font-size:9.5px;font-style:normal;font-weight:600}
.scd span{display:block;color:var(--gray);margin-top:5px}
.scd.sc1{background:#F7F5F1}
.scd.sc2{background:#FEF6E7;border-color:#F0C674}
.scd.sc3{background:#E1F5EE;border-color:#B7E3D3}
.scd.sc3 i{color:#085041}
.scd.sc4{background:#EEEDFE;border-color:#D8D2F5}
.noplan{background:#FCFBF9;border:1px dashed #D5D0C8;border-radius:10px;padding:11px 14px;font-size:11.5px;color:#5A5750;line-height:1.7;margin-bottom:12px}
.noplan b{color:var(--ink)}
.gq{font-size:11px;color:#5A5750;font-style:italic;margin-top:4px;line-height:1.55}
.gh{font-size:9.5px;color:var(--gray);margin-top:3px}
.cd{font-family:ui-monospace,SFMono-Regular,monospace;font-size:10.5px;background:#F2EFE9;border-radius:5px;padding:2px 7px;white-space:nowrap}
.qtabs{display:flex;align-items:center;gap:6px;margin-bottom:13px;flex-wrap:wrap}
.qt{font-family:inherit;font-size:12px;font-weight:600;color:#6A6760;background:#fff;border:1px solid var(--line);
  border-radius:9px;padding:7px 13px;cursor:pointer;display:flex;align-items:center;gap:8px}
.qt:hover{background:#FCFBF9}
.qt.on{background:var(--navy);border-color:var(--navy);color:#fff}
.qt-c{font-size:9.5px;font-weight:400;color:var(--gray)}
.qt.on .qt-c{color:rgba(255,255,255,.6)}
.qt-now{margin-left:auto;font-size:10.5px;color:var(--gray)}
.qhead{background:var(--navy);color:#EDE9E2;border-radius:12px;padding:15px 18px;margin-bottom:16px}
.qhead-t{font-family:'Playfair Display',serif;font-size:19px;font-weight:500}
.qhead-s{font-size:11.5px;color:rgba(237,233,226,.62);margin-top:5px;line-height:1.6}
.qsub{font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--gray);font-weight:600;margin:20px 0 10px}
.qempty{background:#FCFBF9;border:1px dashed #D5D0C8;border-radius:11px;padding:14px 16px;font-size:12px;color:#5A5750;line-height:1.75}
.ff{border:1px solid var(--line);border-radius:12px;margin-bottom:10px;overflow:hidden;background:#fff}
.ff-h{padding:12px 15px;background:#FCFBF9;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ff-n{font-size:13.5px;font-weight:600}
.ff-n .star{font-size:9px;font-weight:600;background:#E1F5EE;color:#085041;border-radius:6px;padding:2px 7px;margin-left:6px;vertical-align:middle}
.ff-m{font-size:10.5px;color:var(--gray);margin-top:3px}
.steps{margin-left:auto;display:flex;gap:3px}
.st{font-size:9px;font-weight:600;padding:4px 9px;border-radius:6px;border:1px solid var(--line);background:#fff;color:#C8C2B8;display:inline-flex;align-items:center;gap:5px}
.st.due{color:#5A5750;border-color:#D5D0C8}
.st b{font-size:8px;font-weight:700;background:#FEF6E7;color:#7A4A05;border-radius:4px;padding:1px 4px}
.ff-b{padding:13px 15px;border-top:1px solid #F0EDE7}
.form-t{font-size:9.5px;font-weight:600;color:#6A6760;margin-bottom:10px;letter-spacing:.06em;text-transform:uppercase}
.fld{margin-bottom:9px}
.fld label{display:block;font-size:10.5px;color:var(--gray);margin-bottom:4px}
.fld.key label{color:#085041;font-weight:600}
.fake{height:32px;border:1px solid var(--line);border-radius:8px;background:#FCFBF9}
.fake.key{border-color:#B7E3D3;background:#F5FBF9}
.qcard{background:#fff;border:1px solid var(--line);border-radius:12px;padding:15px 17px}
.qcard-t{font-size:12px;color:#5A5750;line-height:1.7;margin-bottom:9px}
.qcard-x{font-size:11px;color:var(--gray);margin-top:11px;padding-top:9px;border-top:1px dashed #EDEAE4;line-height:1.65}
table.bt{width:100%;border-collapse:collapse;font-size:12px}
table.bt th{text-align:left;font-size:9px;letter-spacing:.09em;text-transform:uppercase;color:var(--gray);font-weight:600;padding:0 10px 8px 0;border-bottom:1px solid var(--line)}
table.bt td{padding:9px 10px 9px 0;border-bottom:1px solid #EFECE6;vertical-align:middle}
table.bt tr:last-child td{border:none}
.bt-n{font-weight:600;white-space:nowrap}
.rate{display:flex;gap:3px}
.rate .rb{flex:1;min-width:44px;text-align:center;border:1px solid var(--line);background:#FCFBF9;border-radius:6px;font-size:9px;color:#8A8780;padding:5px 2px}
.ins{display:grid;grid-template-columns:120px 1fr;gap:14px;border:1px solid var(--line);border-radius:12px;
  padding:14px 16px;margin-bottom:10px;background:#fff}
.ins-w{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#8A6A3A;line-height:1.6}
.ins-w span{font-weight:400;color:var(--gray);letter-spacing:0;text-transform:none}
.ins-n{font-size:13.5px;font-weight:600;line-height:1.45}
.ins-d{font-size:11.5px;color:var(--gray);line-height:1.7;margin-top:5px}
.ins-f{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.ins-f span{font-size:11px;background:#F7F5F1;border:1px solid #EDEAE4;border-radius:7px;padding:4px 10px}
.ins-f span.key{background:#E1F5EE;border-color:#B7E3D3;color:#085041;font-weight:600}
.ins-x{font-size:11px;color:var(--gray);margin-top:9px;padding-top:8px;border-top:1px dashed #EDEAE4;line-height:1.65}
.ins-scale{display:flex;align-items:center;gap:5px;margin-top:9px;flex-wrap:wrap}
.ins-scale>span{font-size:10px;font-weight:600;padding:3px 9px;border-radius:7px}
.ins-scale .sc1{background:#F5F3F0;color:#8A8780}
.ins-scale .sc2{background:#FEF6E7;color:#7A4A05}
.ins-scale .sc3{background:#E1F5EE;color:#085041}
.ins-scale .sc4{background:#EEEDFE;color:#26215C}
.toc{display:flex;align-items:center;gap:7px;flex-wrap:wrap;background:#FCFBF9;border:1px solid #EDEAE4;
  border-radius:11px;padding:11px 14px;margin-bottom:24px}
.toc-l{font-size:9px;letter-spacing:.11em;text-transform:uppercase;color:var(--gray);font-weight:600;margin-right:4px}
.toc a{font-size:11.5px;color:#5A5750;text-decoration:none;background:#fff;border:1px solid var(--line);
  border-radius:7px;padding:4px 10px;white-space:nowrap}
.toc a:hover{background:var(--navy);color:#fff;border-color:var(--navy)}
.toc-b{margin-left:auto;font-family:inherit;font-size:11px;font-weight:600;color:#6A6760;background:none;
  border:1px solid var(--line);border-radius:7px;padding:5px 12px;cursor:pointer}
.toc-b:hover{background:#fff}
.blk[id]{scroll-margin-top:72px}
@media(max-width:900px){.cols2{grid-template-columns:1fr}.ladder{flex-direction:column;flex-wrap:wrap}.tr{flex:auto;flex-direction:row;gap:10px;padding:10px}}
</style>
</head>
<body>

<div class="topnav">
  <div class="nav-icon">T</div>
  <div>
    <div class="nav-name">The Four Transitions</div>
    <div class="nav-sub">Templates</div>
  </div>
  <a href="hub.html" class="right">☰ All views</a>
</div>

<div class="wrap">
  <div class="sec" style="margin-bottom:18px">
    <div class="sec-t">One ladder, four transitions</div>
    <div class="sec-s">The level is span of responsibility — not title, tenure or pay grade. Click a transition to open its full template: what changes, quarter by quarter, who teaches what, and what the gate asks.</div>
    <div class="ladder" id="ladder"></div>
  </div>
  <div id="detail"></div>
</div>

<script src="data.js?v=20260907192327"></script>
<script src="roster.js?v=20260907192327"></script>
<script src="templates_detail.js?v=20260907192327"></script>
<script src="owners.js?v=20260907192327"></script>
<script>
const x=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const ORDER=['coord-assoc','assoc-sr','sr-agm','agm-gm'];
const RUNGS=[
 {l:'L2',n:'RX Coordinator',c:'Specialist · owns execution'},
 {l:'L2',n:'RX Associate',  c:'Specialist · full breadth'},
 {l:'L3',n:'Senior RX Associate',c:'Lead · directs others'},
 {l:'L4',n:'AGM',           c:'Function Owner · across scope'},
 {l:'L5',n:'GM',            c:'Scope Owner · the result'}];
const KIND={'coord-assoc':['Breadth','background:#EEEDFE;color:#26215C'],
  'assoc-sr':['Level jump','background:#E1F5EE;color:#085041'],
  'sr-agm':['Letting go','background:#FDEEEA;color:#8A2E12'],
  'agm-gm':['Scope','background:#E8EEF6;color:#1A3660']};

let DIMS=[];
let CUR=new URLSearchParams(location.search).get('t');
if(!ORDER.includes(CUR))CUR=ORDER[0];

function foldAll(btn){
  const open=document.querySelectorAll('.fgrp.open').length>0;
  document.querySelectorAll('.fgrp').forEach(e=>e.classList.toggle('open',!open));
  btn.textContent=open?'Unfold groups':'Fold groups';
}
function renderLadder(){
  let h='';
  RUNGS.forEach((r,i)=>{
    h+=`<div class="rung"><div class="rung-l">${r.l}</div><div class="rung-n">${x(r.n)}</div><div class="rung-c">${x(r.c)}</div></div>`;
    if(i<ORDER.length){
      const t=TEMPLATES[ORDER[i]],k=KIND[ORDER[i]];
      h+=`<a class="tr ${CUR===ORDER[i]?'on':''}" href="?t=${ORDER[i]}">
        <span class="tr-a">→</span><span class="tr-c">${t.changed}</span>
        <span class="tr-f">functions<br>change</span>
        <span class="tr-k" style="${k[1]}">${k[0]}</span></a>`;
    }
  });
  document.getElementById('ladder').innerHTML=h;
}

function renderDetail(){
  const T=TEMPLATES[CUR], L=FN_LISTS[CUR], A=ANCHORS[CUR], NR=NOT_READY[CUR];
  const inProg=ROSTER.filter(r=>r.target===CUR);
  DIMS=BEHAVIOURS.filter(b=>!b.fromLevel||T.level>=b.fromLevel);
  const NEWCT=L.reduce((a,g)=>a+g.f.filter(r=>String(r[1]).trim().indexOf('—')===0).length,0);
  document.getElementById('detail').innerHTML=`
    <div class="big">
      <div class="big-h">
        <div class="big-c">Template ${T.code}</div>
        <div class="big-t">${x(T.from)} → ${x(T.to)}</div>
        <div class="big-k">${x(T.kind)}</div>
        <div class="big-m">
          <div><div class="bm-v">${T.changed}</div><div class="bm-l">Functions change</div></div>
          <div><div class="bm-v">${T.months} mo</div><div class="bm-l">Duration</div></div>
          <div><div class="bm-v">${T.quarters.length}</div><div class="bm-l">Quarters</div></div>
          <div><div class="bm-v">${T.agm.hours} + ${T.gm.hours} h</div><div class="bm-l">Coach + sponsor / month</div></div>
          <div><div class="bm-v">${inProg.length}</div><div class="bm-l">People on this path</div></div>
        </div>
      </div>
      <div class="big-b">

        <div class="toc">
          <span class="toc-l">Everything about this transition, in order</span>
          <a href="#s-is">What it is</a><a href="#s-enter">To enter</a><a href="#s-fns">The ${T.changed} functions</a>
          <a href="#s-q">Q1–Q${T.quarters.length}</a><a href="#s-stretch">Stretch</a><a href="#s-instr">What gets filled in</a><a href="#s-who">Who does what</a>
          <a href="#s-beh">Behaviour</a><a href="#s-ext">External training</a><a href="#s-gate">The gate</a><a href="#s-not">Warning signs</a>
          <button class="toc-b" onclick="foldAll(this)">Fold groups</button>
        </div>

        <div class="blk" id="s-is">
          <div class="blk-t">What this transition actually is</div>
          <div class="blk-s">${x(T.essence)} — ${x(T.startState)}</div>
          <div class="shift">
            <span class="shift-x">"${x(T.valueShift[0])}"</span>
            <span style="color:var(--purple);font-size:16px">→</span>
            <span class="shift-x" style="border-color:var(--purple);font-weight:500;font-style:normal">"${x(T.valueShift[1])}"</span>
          </div>
          ${T.blocker?`<div class="warn" style="margin-top:14px"><b>Structural dependency.</b> ${T.blocker}</div>`:''}
        </div>

        <div class="blk" id="s-enter">
          <div class="blk-t">To enter</div>
          <div class="blk-s">All four must be true. Six months in the current role is a settling period — the full operating cycle is completed inside the programme, since the first quarter is observation.</div>
          <ul class="tight">${T.eligibility.map(e=>`<li>${e}</li>`).join('')}</ul>
        </div>

        <div class="blk" id="s-fns">
          <div class="blk-t">The ${T.changed} functions that change</div>
          <div class="blk-s"><b>${T.changed} of the operating model's 48 functions change level of involvement here</b>${NEWCT?` — ${NEWCT} of them touched for the first time`:''}. A function is what the Operating Playbook staffs: a standing responsibility with an owner and a standard — <i>Move-ins</i>, <i>Incident Management</i>, <i>Shift handover</i> — not a daily task. What moves is the code against each one: <span class="cd">— → assist → execute → own → oversee</span>. Nothing here was written by hand; it is read from <b>ops_function_operating</b>.</div>
          <div class="blk-s" style="margin-top:-6px">Grouped by what kind of change each one is. Every function is named — click a group heading to fold it away.</div>
          ${L.map((g,i)=>`<div class="fgrp open" id="g${i}">
            <div class="fgrp-h" onclick="document.getElementById('g${i}').classList.toggle('open')">
              <span class="fdot" style="background:${g.c}"></span>
              <span class="fgrp-n">${x(g.n)}</span>
              <span class="fgrp-c" style="color:${g.c}">${g.f.length}</span></div>
            <div class="fgrp-b">
              <div class="fgrp-d">${x(g.d)}</div>
              ${g.f.map(f=>`<div class="fn"><span>${x(f[0])}</span>
                ${f[2]?`<span class="fn-w">${x(f[2])}</span>`:''}
                <span class="fn-t">${x(f[1])}</span></div>`).join('')}
            </div></div>`).join('')}
        </div>

        <div class="blk" id="s-q">
          <div class="blk-t">${T.months} months — exactly what the person sees, quarter by quarter</div>
          <div class="blk-s">This is the employee's own page with nobody in it. Everything below is what they will read, fill in and be asked, in the order it happens. Three functions in deliberate focus at a time — the order is chosen for risk: safe work first, the unfamiliar second, ownership last.</div>
          <div class="qtabs" id="qtabs"></div>
          <div id="qpane"></div>
        </div>

        <div class="blk" id="s-stretch">
          <div class="blk-t">The stretch assignment</div>
          <div class="blk-s">Real scope with real stakes. Without genuine risk this gate is paperwork — people protect rather than stretch.</div>
          <div class="fn" style="background:#FEF6E7;border-color:#F0C674;padding:12px 14px"><b>${x(T.stretch.what)}</b></div>
          <div class="cols2" style="margin-top:12px">
            <div><div class="blk-s" style="margin:0 0 5px;color:#0A5540;font-weight:600">Acceptable</div>
              <div style="font-size:12px;line-height:1.7;color:#5A5750">${x(T.stretch.ok)}</div></div>
            <div><div class="blk-s" style="margin:0 0 5px;color:#8A2E12;font-weight:600">Intervene</div>
              <div style="font-size:12px;line-height:1.7;color:#5A5750">${x(T.stretch.stop)}</div></div>
          </div>
        </div>

        <div class="blk" id="s-instr">
          <div class="blk-t">What actually gets filled in — and when</div>
          <div class="blk-s">Four instruments, no more. Everything else in this programme is conversation and work.</div>

          <div class="ins">
            <div class="ins-w">After every practice</div>
            <div class="ins-b">
              <div class="ins-n">The practice log — <b>the employee writes it, in their own words</b></div>
              <div class="ins-d">Not a form anyone else fills in. It is what makes this development rather than a checklist.</div>
              <div class="ins-f"><span>What did I try?</span><span>What happened?</span>
                <span class="key">What would I do differently?</span><span>What do I need?</span></div>
              <div class="ins-x">The third field is the one that matters. An entry without it is a diary, not a reflection.</div>
            </div>
          </div>

          <div class="ins">
            <div class="ins-w">Every month<br><span>× ${T.months}</span></div>
            <div class="ins-b">
              <div class="ins-n">The same four questions — with ${x((T.agm.label||'the AGM').replace('Coach · ',''))}</div>
              <div class="ins-d">They do not change between quarters. Their power is in the repetition — by the fourth month the employee prepares an answer before being asked.</div>
              <ul class="tight" style="margin-top:6px">${T.questions.map(q=>`<li>${q}</li>`).join('')}</ul>
              <div class="ins-x">Ends with <b>one specific commitment</b> for the coming month — not a list.</div>
            </div>
          </div>

          <div class="ins">
            <div class="ins-w">Every quarter<br><span>× ${T.quarters.length}</span></div>
            <div class="ins-b">
              <div class="ins-n">Behaviour rating — ${DIMS.length} dimensions, <b>self first, then manager</b></div>
              <div class="ins-d">The employee rates before seeing the manager's rating; the conversation starts from the gap. Kept per quarter, so the direction of travel is visible — a dimension that never moves is the finding.</div>
              <div class="ins-f">${DIMS.map(d=>`<span>${x(d.n)}</span>`).join('')}</div>
              <div class="ins-scale">${SCALE.map(s=>`<span class="sc${s.v}" title="${x(s.d||'')}">${x(s.l)}</span>`).join('')}
                <span class="ins-x" style="margin:0 0 0 auto;padding:0;border:none"><b>Every time</b> is the gate standard</span></div>
            </div>
          </div>

          <div class="ins">
            <div class="ins-w">Once, at the end</div>
            <div class="ins-b">
              <div class="ins-n">The gate — five checks, no averaging</div>
              <div class="ins-d">Detailed below. The only moment in the programme that produces a decision.</div>
            </div>
          </div>
        </div>

        <div class="blk" id="s-who">
          <div class="blk-t">Who does what</div>
          <div class="cols2">
            <div><div class="blk-s" style="margin-bottom:8px"><b>${x(T.agm.label||'Coach · AGM')}</b> — ${T.agm.hours} h / month</div>
              <ul class="tight">${T.agm.acts.map(a=>`<li>${a}</li>`).join('')}</ul></div>
            <div><div class="blk-s" style="margin-bottom:8px"><b>${x(T.gm.label||'Sponsor · GM')}</b> — ${T.gm.hours} h / month</div>
              <ul class="tight">${T.gm.acts.map(a=>`<li>${a}</li>`).join('')}</ul></div>
          </div>
          <div class="blk-s" style="margin-top:14px"><b>The employee</b> — keeps the practice log and answers four questions each month:</div>
          <ul class="tight">${T.questions.map(q=>`<li>${q}</li>`).join('')}</ul>
        </div>

        <div class="blk" id="s-beh">
          <div class="blk-t">Behaviour — from, to</div>
          <div class="blk-s">A four-point <b>consistency</b> scale — it measures how often, not how well.</div>
          <div class="scdef">${SCALE.map(s=>`<div class="scd sc${s.v}"><b>${x(s.l)}</b>${s.v===3?' <i>← the gate standard</i>':''}<span>${x(s.d||'')}</span></div>`).join('')}</div>
          <table class="t"><thead><tr><th style="width:22%">Dimension</th><th style="width:33%">At the current level</th><th>Required at the next</th></tr></thead>
            <tbody>${A.map(a=>`<tr><td><b>${x(a[0])}</b></td><td style="color:var(--gray)">${x(a[1])}</td><td>${x(a[2])}</td></tr>`).join('')}</tbody></table>
        </div>

        <div class="blk" id="s-ext">
          <div class="blk-t">External training</div>
          <div class="blk-s">Bought only where the capability does not exist internally. <b>No course without a planned application within thirty days</b> — unapplied knowledge evaporates.</div>
          ${T.external.map(e=>`<div class="fn" style="padding:11px 13px"><b>${x(e.c)}</b>
            <span class="fn-w">Q${e.q}</span><span class="fn-t">${x(e.why)}</span></div>`).join('')}
        </div>

        <div class="blk" id="s-gate">
          <div class="blk-t">The gate — all five, no averaging</div>
          <div class="blk-s">Strong on one and weak on another is a specific finding. An average erases exactly what the decision turns on.</div>
          <table class="t"><thead><tr><th style="width:22%">Check</th><th>What it asks</th></tr></thead>
            <tbody>${T.gates.map(g=>{const D=(typeof DIMENSIONS!=='undefined'&&DIMENSIONS[g[0]])||null;return `<tr><td><b>${x(g[0])}</b>${D?`<div class="gq">${x(D.q)}</div><div class="gh">${x(D.how)}</div>`:''}</td><td>${g[1]}</td></tr>`;}).join('')}</tbody></table>
          <div class="warn" style="margin-top:14px"><b>Fail rule.</b> ${x(T.failRule)}</div>
        </div>

        <div class="blk" id="s-not" style="margin-bottom:0">
          <div class="blk-t">Signs it has not happened</div>
          <div class="blk-s">Worth watching for during the programme, not only at the gate.</div>
          <ul class="tight">${NR.map(n=>`<li>${x(n)}</li>`).join('')}</ul>
        </div>

      </div>
    </div>

    ${inProg.length?`<div class="sec">
      <div class="sec-t">On this path</div>
      <div class="sec-s">Everyone whose target transition is ${T.code}.</div>
      ${inProg.map(r=>{const s=PSTATE[r.state]||PSTATE.practising;
        const prop=PROPERTIES.find(p=>p.id===r.prop);
        return `<div class="row"><div style="flex:1"><b>${x(r.name)}</b>
          <div style="font-size:11.5px;color:var(--gray);margin-top:2px">${x(r.role)} · ${x(prop.name)}</div></div>
          <span class="chip" style="${s.s}">${s.n}</span>
          <a href="plan.html?emp=${r.id}" style="font-size:11.5px;color:var(--navy);margin-left:12px">open plan →</a></div>`;}).join('')}
    </div>`:''}`;
}

/* ── the quarter exactly as the employee will see it, with nobody in it ── */
let TQ=1;
function setTQ(n){TQ=n;renderQuarter();}

function renderQuarter(){
  const T=TEMPLATES[CUR], q=T.quarters.find(z=>z.n===TQ)||T.quarters[0];
  const KEY={o:0,a:1,s:2,w:3};
  const POS=['RX Coordinator','RX Associate','Senior RX Associate','Assistant General Manager','General Manager'];
  const STEPS=[['Observe','what good looks like'],['With support','someone alongside'],
               ['Alone','nobody watching'],['Owned','the result is yours']];

  document.getElementById('qtabs').innerHTML=T.quarters.map(z=>
    `<button class="qt ${z.n===TQ?'on':''}" onclick="setTQ(${z.n})">Q${z.n}
      <span class="qt-c">${x(z.period)}</span></button>`).join('')
    + `<span class="qt-now">Month ${(TQ-1)*3+1}–${TQ*3} of ${T.months}</span>`;

  document.getElementById('qpane').innerHTML=`
    <div class="qhead">
      <div class="qhead-t">Q${q.n} — "${x(q.goal)}"</div>
      <div class="qhead-s">${x(q.why||q.period)}</div>
    </div>

    ${q.fns.length?`
    <div class="qsub">${q.plan?'The functions in focus — each step carries the month it is due, so plan and reality can be compared':'In focus this quarter'}</div>
    ${q.noPlan?`<div class="noplan"><b>No step ladder this quarter.</b> ${x(q.noPlan)}</div>`:''}
    ${q.fns.map((f,fi)=>{
      const nm=f.replace('★ ','').replace(/ \([^)]*\)$/,'');
      const oi=(typeof FN_OWNER!=='undefined')?FN_OWNER[nm]:undefined;
      const teach=(oi===undefined)?null:(oi<0?'no single owner — the coach carries it':POS[oi]);
      return `<div class="ff">
        <div class="ff-h">
          <div><div class="ff-n">${x(f.replace('★ ',''))}${f.indexOf('★')===0?' <span class="star">ownership handed over</span>':''}</div>
            <div class="ff-m">${teach?'taught by the <b>'+x(teach)+'</b> — whoever owns it, teaches it':'a programme activity, not a function — run by the coach'} · <b>15 minutes a week</b></div></div>
          <div class="steps">${STEPS.map((s,si)=>{
            const first=q.plan?q.plan.map(r=>KEY[r[fi]]).indexOf(si):-1;
            return `<span class="st ${first>=0?'due':''}" title="${s[1]}">${s[0]}
              ${first>=0?`<b>M${(TQ-1)*3+first+1}</b>`:''}</span>`;}).join('')}</div>
        </div>
        <div class="ff-b">
          ${(q.example&&q.example.fn===nm)?`<div class="exmp">
            <div class="exmp-t">An example of a real entry — what a good one looks like</div>
            <div class="exmp-r"><span>What did I try?</span><div>${q.example.a}</div></div>
            <div class="exmp-r"><span>What happened?</span><div>${q.example.o}</div></div>
            <div class="exmp-r key"><span>What would I do differently?</span><div>${q.example.w}</div></div>
            <div class="exmp-r"><span>What do I need?</span><div>${q.example.n}</div></div>
            <div class="exmp-x">Nothing here is a score. The third line is the only one that changes what happens next week — and the fourth is the only one the coach can act on.</div>
          </div>`:''}
          <div class="form-t">The practice entry — the employee writes it, after each attempt</div>
          <div class="fld"><label>What did I try?</label><div class="fake"></div></div>
          <div class="fld"><label>What happened?</label><div class="fake"></div></div>
          <div class="fld key"><label>What would I do differently?</label><div class="fake key"></div></div>
          <div class="fld"><label>What do I need?</label><div class="fake"></div></div>
        </div></div>`;}).join('')}`
    :`<div class="qempty">No function is handed over this quarter. It is spent watching the work that is coming — the first contractor, the first crisis — before carrying any of it.</div>
    ${q.observation?`<div class="ff">
      <div class="ff-h"><div><div class="ff-n">${x(q.observation.title)}</div>
        <div class="ff-m">the employee writes it &mdash; there is no function to stand in front of yet</div></div></div>
      <div class="ff-b">
        <div style="font-size:11.5px;color:#5A5750;line-height:1.75;margin-bottom:13px">${x(q.observation.why)}</div>
        <div class="exmp">
          <div class="exmp-t">An example of a real entry — what a good one looks like</div>
          ${q.observation.fields.map(f=>`<div class="exmp-r ${f[0]==='w'?'key':''}">
            <span>${x(f[1])}</span><div>${q.observation.example[f[0]]}</div></div>`).join('')}
          <div class="exmp-x">${x(q.observation.note)}</div>
        </div>
        <div class="form"><div class="form-t">The observation entry — the employee writes it</div>
          ${q.observation.fields.map(f=>`<div class="fld ${f[0]==='w'?'key':''}">
            <label>${x(f[1])}</label><textarea rows="2" placeholder="${x(f[2]||'')}" disabled></textarea></div>`).join('')}
          <div style="font-size:10.5px;color:var(--gray);margin-top:7px">Shown as it appears on the employee's page.</div>
        </div>
      </div></div>`:''}
    `}

    <div class="qsub">Month by month</div>
    ${q.months.map((m,i)=>`<div class="mo"><span class="mo-m">Month ${(TQ-1)*3+i+1}</span><span class="mo-t">${m}</span></div>`).join('')}
    <div class="mile">Milestone — ${x(q.milestone)}</div>

    <div class="qsub">The monthly conversation — three times this quarter</div>
    <div class="qcard">
      <div class="qcard-t">45 minutes with the coach. Does not begin with "how are things going?"</div>
      <ul class="tight">${T.questions.map(z=>`<li>${z}</li>`).join('')}</ul>
      <div class="qcard-x">Ends with <b>one specific commitment</b> for the coming month — not a list.</div>
    </div>

    <div class="qsub">The behaviour rating — once, at the end of Q${q.n}</div>
    <div class="qcard">
      <div class="qcard-t">The employee rates first, then the manager. The conversation starts from the gap.</div>
      <table class="bt"><thead><tr><th>Dimension</th><th>Employee</th><th>Manager</th></tr></thead>
        <tbody>${DIMS.map(b=>`<tr><td class="bt-n">${x(b.n)}</td>
          <td><div class="rate">${SCALE.map(o=>`<span class="rb">${x(o.l)}</span>`).join('')}</div></td>
          <td><div class="rate">${SCALE.map(o=>`<span class="rb">${x(o.l)}</span>`).join('')}</div></td></tr>`).join('')}</tbody></table>
      <div class="qcard-x"><b>Every time</b> on all ${DIMS.length} is the gate standard${TQ===T.quarters.length?' — and this is the quarter it is judged.':', and every quarter is kept so the direction of travel shows.'}</div>
    </div>

    ${TQ===T.quarters.length?`<div class="warn" style="margin-top:14px"><b>The gate closes this quarter.</b> ${x(T.failRule)}</div>`:''}`;
}

renderLadder();renderDetail();TQ=1;renderQuarter();
</script>
</body>
