<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RX Career Path — Meeting Brief</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--cream:#F5F0E8;--ink:#1C1C1C;--gray:#8A8780;--line:#DDD8CF;
--navy:#1A3660;--green:#1D9E75;--amber:#EF9F27;--red:#E07050;--purple:#7C5CBF;--teal:#0D6E5C;
--p1:#C8853A;--p2:#7C5CBF;--p3:#0D6E5C;--p4:#1D3A8A}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:#E9E4DA;color:var(--ink);font-size:13px;line-height:1.6}
.sheet{max-width:900px;margin:0 auto;background:#fff;padding:34px 40px 44px}

h1{font-family:'Playfair Display',serif;font-size:27px;font-weight:600;color:var(--navy)}
.sub{font-size:12.5px;color:var(--gray);margin-top:6px;line-height:1.7}
.hdr{border-bottom:2px solid var(--navy);padding-bottom:16px;margin-bottom:22px}
.warn{background:#FEF6E7;border:1px solid #F0C674;border-radius:9px;padding:11px 14px;font-size:11.5px;color:#6B4A15;margin-top:13px;line-height:1.7}

h2{font-family:'Playfair Display',serif;font-size:19px;font-weight:500;margin:30px 0 4px;
   padding-top:14px;border-top:1px solid var(--line)}
h2 span{font-family:'Inter';font-size:9.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;
   color:var(--gray);display:block;margin-bottom:5px}
.lead{font-size:12px;color:var(--gray);margin-bottom:14px;line-height:1.7}

table{width:100%;border-collapse:collapse;font-size:12px;margin-bottom:10px}
th{text-align:left;font-size:8.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--gray);
   font-weight:700;padding:0 9px 7px 0;border-bottom:1px solid var(--line);vertical-align:bottom}
td{padding:8px 9px 8px 0;border-bottom:1px solid #EFECE6;vertical-align:top;line-height:1.65}
tr:last-child td{border-bottom:none}
td.n{font-weight:600;white-space:nowrap}
td.c{text-align:center;white-space:nowrap}
.q{font-style:italic;color:#4A4740}
.src{font-size:10px;color:var(--gray)}

.pill{font-size:9.5px;font-weight:700;padding:2px 8px;border-radius:6px;white-space:nowrap;display:inline-block}
.s1{background:#F5F3F0;color:#7A756C}.s2{background:#FEF6E7;color:#7A4A05}
.s3{background:#E1F5EE;color:#085041}.s4{background:#EEEDFE;color:#26215C}
.star{color:#085041;font-weight:700}

.qbox{border:1px solid var(--line);border-radius:10px;padding:13px 15px;margin-bottom:9px;break-inside:avoid}
.qbox-h{display:flex;align-items:baseline;gap:9px;margin-bottom:8px}
.qbox-c{font-family:'Playfair Display',serif;font-size:15px;font-weight:600;color:#fff;
   background:var(--navy);border-radius:6px;padding:1px 9px;flex-shrink:0}
.qbox-t{font-size:13.5px;font-weight:600}
.qbox-p{font-size:11px;color:var(--gray);margin-left:auto;white-space:nowrap}
ol.qs{margin:0;padding-left:20px;font-size:12px;line-height:1.9}
ol.qs li b{font-weight:600}

.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-bottom:12px}
.card{border:1px solid var(--line);border-radius:10px;padding:11px 13px;break-inside:avoid}
.card-t{font-family:'Playfair Display',serif;font-size:16px;font-weight:600;line-height:1.15}
.card-n{font-size:9px;color:var(--gray);letter-spacing:.05em;text-transform:uppercase;margin-top:5px;line-height:1.5}
.card-b{font-size:11px;color:#5A5750;margin-top:8px;padding-top:8px;border-top:1px solid #F0EDE7;line-height:1.6}
.c1{border-top:3px solid var(--p1)}.c2{border-top:3px solid var(--p2)}
.c3{border-top:3px solid var(--p3)}.c4{border-top:3px solid var(--p4)}

.nums{display:flex;gap:26px;flex-wrap:wrap;background:#FCFBF9;border:1px solid var(--line);
  border-radius:10px;padding:14px 18px;margin-bottom:8px}
.nm-v{font-family:'Playfair Display',serif;font-size:22px;font-weight:600;color:var(--navy);line-height:1}
.nm-l{font-size:9.5px;color:var(--gray);margin-top:4px;line-height:1.45}

.ar{direction:rtl;text-align:right;font-size:13.5px;line-height:1.95}
.ar h3{font-family:'Playfair Display',serif;font-size:15px;font-weight:600;margin:16px 0 6px}
.ar .a-q{background:#FDEEEA;border-right:3px solid var(--red);border-radius:8px;padding:10px 14px;margin-bottom:6px;font-weight:600}
.ar .a-a{padding:0 14px 14px;color:#4A4740}
.ar b{color:var(--navy)}
.said{background:var(--navy);color:#EDE9E2;border-radius:10px;padding:15px 19px;margin:14px 0;
  font-family:'Playfair Display',serif;font-size:15.5px;line-height:1.75}
.said b{color:#fff}

.foot{margin-top:26px;padding-top:14px;border-top:1px solid var(--line);font-size:10px;color:var(--gray);line-height:1.7}
@media print{
  body{background:#fff}
  .sheet{max-width:none;padding:0 12mm}
  h2{page-break-after:avoid}
  .qbox,.card,tr{page-break-inside:avoid}
  .pagebreak{page-break-before:always}
  @page{size:A4 portrait;margin:14mm 0}
}
</style>
</head>
<body>
<div class="sheet" id="sheet"></div>

<script src="data.js?v=20260907203029"></script>
<script src="templates_detail.js?v=20260907203029"></script>
<script>
const x=s=>String(s==null?'':s);
const ORDER=['coord-assoc','assoc-sr','sr-agm','agm-gm'];
const THEME={'coord-assoc':['Breadth','c1'],'assoc-sr':['Ownership','c2'],
             'sr-agm':['Letting go','c3'],'agm-gm':['Scope','c4']};
const FIRST={'coord-assoc':7,'assoc-sr':8,'sr-agm':5,'agm-gm':9};
let h='';

/* ── header ── */
h+=`<div class="hdr">
  <h1>RX Career Path — Meeting Brief</h1>
  <div class="sub">Every term, label, question and definition in the programme, quoted exactly as it appears on the pages.
    Generated from <b>data.js</b>, so nothing here can drift from the live system.</div>
  <div class="warn"><b>How to use this.</b> The left-hand words are the ones on screen and must be quoted exactly —
    they are the shared vocabulary. The Arabic section at the end is for speaking, not for the interfaces.</div>
</div>`;

/* ── the frame ── */
h+=`<div class="said">The operating system defines <b>what must be done</b>.<br>
  This path builds <b>the people who do it</b>.</div>`;

h+=`<div class="nums">
  <div><div class="nm-v">48</div><div class="nm-l">functions in the<br>operating model</div></div>
  <div><div class="nm-v">4</div><div class="nm-l">transitions, each a<br>different kind of change</div></div>
  <div><div class="nm-v">6.5</div><div class="nm-l">years from joining<br>to General Manager</div></div>
  <div><div class="nm-v">5</div><div class="nm-l">behaviour dimensions<br>(6 from Senior up)</div></div>
  <div><div class="nm-v">5</div><div class="nm-l">gate checks,<br>no averaging</div></div>
  <div><div class="nm-v">4</div><div class="nm-l">instruments —<br>and nothing else</div></div>
</div>`;

/* ── 1 · rating scale ── */
h+=`<h2><span>1 — the words people will ask about first</span>The rating scale</h2>
<div class="lead">A four-point <b>consistency</b> scale. It measures how <i>often</i>, not how <i>well</i> —
  because quality is an opinion and consistency is an observation.</div>
<table><thead><tr><th style="width:15%">Label</th><th>Definition, verbatim</th><th style="width:22%">Note</th></tr></thead><tbody>
${SCALE.map(s=>`<tr><td><span class="pill s${s.v}">${x(s.l)}</span></td>
  <td>${x(s.d)}</td>
  <td class="src">${s.v===3?'<span class="star">← the gate standard</span>':s.v===1?'A gap in evidence, not a verdict':s.v===4?'The next level, not required to pass':''}</td></tr>`).join('')}
</tbody></table>
<div class="lead" style="margin-bottom:0">Arabic, for speaking only: <b>لم يبدأ · أحياناً · في كل مرة · يُعلّم</b></div>`;

/* ── 2 · the gate ── */
h+=`<h2><span>2 — what the gate actually asks</span>The gate checks</h2>
<div class="lead">Strong on one and weak on another is a specific finding. An average erases exactly what the decision turns on.
  <b>Only one of the five is a matter of opinion</b> — the rest are computed, read, or tested by real work.</div>
<table><thead><tr><th style="width:16%">Check</th><th style="width:42%">The question it asks</th><th>Where the answer comes from</th></tr></thead><tbody>
${Object.entries(DIMENSIONS).map(([k,v])=>`<tr><td class="n">${x(k)}</td>
  <td class="q">${x(v.q)}</td><td class="src">${x(v.how)}</td></tr>`).join('')}
</tbody></table>`;

/* ── 3 · behaviours ── */
h+=`<h2><span>3 — the observed dimension</span>Behaviour: five, not thirty</h2>
<div class="lead">Taken from Flow's values, not invented for the programme. Rated once each quarter — self first, then manager —
  and the conversation starts from the gap between the two.</div>
<table><thead><tr><th style="width:34%">Dimension</th><th>Applies from</th></tr></thead><tbody>
${BEHAVIOURS.map(b=>`<tr><td class="n">${x(b.n)}</td>
  <td class="src">${b.fromLevel?'<b>L'+b.fromLevel+' upward only</b> — nobody below Senior is asked to teach':'every level'}</td></tr>`).join('')}
</tbody></table>`;

/* ── 4 · the four transitions ── */
h+=`<h2><span>4 — the ladder</span>The four transitions</h2>
<div class="lead">Every number below is read from <b>ops_function_operating</b> in Flow Community OS — the same matrix the
  Operating Playbook uses to set who assists, executes, owns and oversees each of the 48 functions.</div>
<div class="grid4">
${ORDER.map(k=>{const t=TEMPLATES[k],th=THEME[k];
 return `<div class="card ${th[1]}">
   <div class="card-t">${th[0]}</div>
   <div class="card-n">${x(t.from)}<br>&rarr; ${x(t.to)}</div>
   <div class="card-b"><b>${t.changed}</b> functions change<br>
     <b>${FIRST[k]}</b> touched for the first time<br>
     <b>${t.months===18?'6 + 18':'6 + 12'} months</b> · ${t.quarters.length} quarters</div></div>`;}).join('')}
</div>
<table><thead><tr><th style="width:14%">Code</th><th>What it is, verbatim</th></tr></thead><tbody>
${ORDER.map(k=>{const t=TEMPLATES[k];
 return `<tr><td class="n">${t.code}</td><td><b>${x(t.kind)}</b><br>
   <span class="q">${x(t.essence)}</span><br>
   <span class="src">Value shift: &ldquo;${x(t.valueShift[0])}&rdquo; &rarr; <b>&ldquo;${x(t.valueShift[1])}&rdquo;</b></span></td></tr>`;}).join('')}
</tbody></table>`;

/* ── 5 · instruments ── */
h+=`<h2 class="pagebreak"><span>5 — everything that gets filled in</span>Four instruments, no more</h2>
<div class="lead">Everything else in this programme is conversation and work.</div>
<table><thead><tr><th style="width:20%">When</th><th>What</th></tr></thead><tbody>
<tr><td class="n">After every practice</td><td><b>The practice log</b> — the employee writes it, in their own words.
  Four fields: <b>What did I try?</b> · <b>What happened?</b> · <b class="star">What would I do differently?</b> · <b>What do I need?</b><br>
  <span class="src">The third field is the one that matters. An entry without it is a diary, not a reflection.
  The fourth is the only one the coach can act on.</span></td></tr>
<tr><td class="n">Every week · 15 min</td><td><b>One function, one observation, one correction</b> — run by <b>whoever owns that function</b>,
  not by the coach. The coach's job is to make sure it happened.<br>
  <span class="src">This is what makes coaching capacity self-generating: everyone who masters a function becomes its teacher.</span></td></tr>
<tr><td class="n">Every month · 45 min</td><td><b>The same four questions</b> — they do not change between quarters.
  Their power is in the repetition. Ends with <b>one specific commitment</b>, not a list.<br>
  <span class="src">Does not begin with &ldquo;how are things going?&rdquo;</span></td></tr>
<tr><td class="n">Every quarter</td><td><b>The behaviour rating</b> — five dimensions, self first then manager. Kept per quarter,
  so the direction of travel is visible.<br><span class="src">A dimension that never moves is the finding.</span></td></tr>
<tr><td class="n">Once, at the end</td><td><b>The gate</b> — four or five checks, no averaging. The only moment in the programme that produces a decision.</td></tr>
</tbody></table>`;

/* ── 6 · the monthly questions ── */
h+=`<h2><span>6 — the sixteen questions</span>Monthly conversation, by transition</h2>
<div class="lead">Four per transition, unchanged for the whole twelve or eighteen months.
  Notice that <b>T3 is inverted</b> — it asks what stopped, not what started.</div>
${ORDER.map(k=>{const t=TEMPLATES[k];
 return `<div class="qbox"><div class="qbox-h"><span class="qbox-c">${t.code}</span>
   <span class="qbox-t">${x(t.from)} &rarr; ${x(t.to)}</span>
   <span class="qbox-p">${THEME[k][0]}</span></div>
   <ol class="qs">${t.questions.map(q=>`<li>${q}</li>`).join('')}</ol></div>`;}).join('')}`;

/* ── 7 · quarter themes ── */
h+=`<h2 class="pagebreak"><span>7 — all eighteen</span>Quarter themes</h2>
<div class="lead">The goal is written in the employee's voice. The theme names the kind of quarter it is.</div>
${ORDER.map(k=>{const t=TEMPLATES[k];
 return `<table><thead><tr><th style="width:8%">${t.code}</th>
   <th style="width:46%">${x(t.from)} &rarr; ${x(t.to)}</th><th>Theme</th></tr></thead><tbody>
   ${t.quarters.map(q=>`<tr><td class="c">Q${q.n}</td><td><b>${x(q.goal)}</b></td>
     <td class="src">${x(q.period)}</td></tr>`).join('')}</tbody></table>`;}).join('')}`;

/* ── 8 · gate wording per transition ── */
h+=`<h2 class="pagebreak"><span>8 — the exact bar</span>What each gate demands</h2>
${ORDER.map(k=>{const t=TEMPLATES[k];
 return `<div class="qbox"><div class="qbox-h"><span class="qbox-c">${t.code}</span>
   <span class="qbox-t">${x(t.to)}</span></div>
   <table style="margin:0"><tbody>${t.gates.map(g=>`<tr><td class="n" style="width:22%">${x(g[0])}</td><td>${g[1]}</td></tr>`).join('')}</tbody></table>
   <div class="src" style="margin-top:9px;padding-top:8px;border-top:1px dashed var(--line)">
     <b>Fail rule.</b> ${x(t.failRule)}</div></div>`;}).join('')}`;

/* ── 10 · governance ── */
h+=`<h2><span>9 — who decides</span>Governance in one table</h2>
<table><thead><tr><th style="width:22%">Role</th><th>What they do</th><th style="width:26%">What they cannot do</th></tr></thead><tbody>
<tr><td class="n">The employee</td><td>Writes the practice record. The development is theirs to do.</td><td class="src">Cannot pass their own gate</td></tr>
<tr><td class="n">The function owner</td><td>Teaches the craft — 15 minutes a week. Whoever owns it, teaches it.</td><td class="src">Does not rate, does not decide</td></tr>
<tr><td class="n">AGM — the coach</td><td>Carries conduct and scope. Runs the monthly session. Follows up on the ground.</td><td class="src"><b>Cannot start or approve a programme</b></td></tr>
<tr><td class="n">GM — the sponsor</td><td><b>Answers the readiness question and starts the programme.</b> Judges the gate. Signs the promotion.</td><td class="src">Cannot promote without a passed gate</td></tr>
<tr><td class="n">People Team</td><td><b>Sees every record.</b> Audits the process, convenes calibration, detects bias.</td><td class="src"><b>Decides nothing.</b> Sight without vote</td></tr>
</tbody></table>
<div class="said" style="font-size:14.5px">Six months in the role &rarr; <b>the GM answers: ready to start?</b><br>
  Yes &rarr; the programme begins. Not yet &rarr; <b>held three months, with three things written down</b> — and the ceiling is three holds.</div>`;

/* ── 11 · Arabic talking points ── */
h+=`<h2 class="pagebreak"><span>10 — for speaking, not for the screens</span>نقاط الحوار</h2>
<div class="ar">
<div class="said" style="font-family:'Inter';font-size:14px;direction:rtl;text-align:right">
  <b>نظام التشغيل يحدد ما يجب أن يُنفَّذ. وهذا المسار يبني من ينفّذه.</b><br>
  <span style="color:rgba(237,233,226,.7);font-size:13px">النظام يوسّع تشك-لست. والناس وحدهم يوسّعون روحاً.</span></div>

<h3>ثلاث جمل تُقال مرة واحدة وتُغني عن شرح طويل</h3>
<div class="a-a">
① <b>«المقياس يقيس الاتساق لا الجودة»</b> — لأن الجودة رأي والاتساق ملاحظة.<br>
② <b>«فحص واحد فقط من الخمسة يُعطى بالرأي»</b> — والباقي محسوب أو مقروء أو مُختبَر بعمل حقيقي.<br>
③ <b>«الانتقال الثالث فيه خمس وظائف جديدة فقط من ٤٦»</b> — فهو ترقية بالتخلّي لا بالإتقان.
</div>

<h3>الأسئلة الصعبة وإجاباتها</h3>

<div class="a-q">ليش ما نستخدم إطار كفاءات جاهز؟</div>
<div class="a-a">لأن هذا <b>مقروء من نظام تشغيلنا</b> لا مستورد. كل رقم يُشتقّ من <b>ops_function_operating</b> — نفس المصفوفة التي يبني عليها الـPlaybook توظيفنا. الإطار الجاهز يقيس كفاءات عامة؛ هذا يقيس <b>وظائفنا نحن بأسمائها</b>.</div>

<div class="a-q">مين يقرر الترقية؟ ووش يمنع المجاملة؟</div>
<div class="a-a">الـ<b>GM</b> يجيب سؤال الجاهزية ويبدأ البرنامج ويوقّع البوابة. و<b>People Team يرى كل شيء ويقرر لا شيء</b> — رؤية بلا صوت.<br>وثلاثة أشياء تمنع المجاملة: البوابة <b>بلا متوسط</b> (ضعف في بُعد واحد يوقفها) · <b>صفر ترقيات بلا بوابة</b> مؤشر معلن · والترقية عندنا <b>تسلّم مبنى</b>، فبلا مبنى شاغر لا تحدث أصلاً.</div>

<div class="a-q">هذا وقت كثير من المدراء — من وين يجي؟</div>
<div class="a-a">الحِرفة <b>لا يعلّمها المدرب</b> — يعلّمها <b>مالك الوظيفة</b> في ١٥ دقيقة أسبوعياً. فالطاقة <b>ذاتية التوليد</b>: كل من أتقن وظيفة صار معلّماً لها.<br>ويبقى على المدرب <b>٤٫٥ ساعة شهرياً</b> وعلى الـGM <b>١٫٥</b> — وهذا الرقم على الشاشة لكل قالب.</div>

<div class="a-q">ليش الاختبار ٦.٥ سنة؟ ما هي طويلة؟</div>
<div class="a-a">هي <b>الأرضية لا المتوسط</b>: ٦ أشهر ممارسة + ١٢ شهر تطوير لكل انتقال، و١٨ للأخير. وتفترض عبور كل بوابة من أول مرة <b>ووجود مبنى شاغر</b> في كل مرة.<br>والخلاصة التجارية: <b>٥ مجمعات في ٢٠٢٧ = ٥ مدراء عامّين و٥ مساعدين</b>، بناؤهم يبدأ اليوم أو نوظّفهم من الخارج بلا نظام تشغيل فلو في رؤوسهم.</div>

<div class="a-q">ليش السجل يكتبه الموظف؟ ما نضمن جدّيته.</div>
<div class="a-a">لأن الي يكتبه غيره <b>يصير استمارة</b>. والسجل ليس دليل إنجاز، بل <b>دليل تأمّل</b> — والحقل الثالث «ماذا سأفعل مختلفاً؟» هو الوحيد الذي يغيّر الأسبوع القادم.<br>والضمان مو في الكتابة، بل في <b>البوابة</b>: تقرأ السجل وتسأل هل تحوّل التصحيح إلى عادة.</div>

<div class="a-q">وش الي مو جاهز بعد؟</div>
<div class="a-a">أقولها قبل ما يسألوا: الصفحات <b>تعرض الحوكمة ولا تفرضها</b> — لا صلاحيات ولا سجل تغييرات، والبيانات محلية. والقرار المطلوب منهم: <b>جعل «تطوير الناس» وظيفة</b> في نموذج التشغيل — هي صفر من ٤٨ اليوم، وهذا <b>شرط تقني</b> لأي متابعة آلية لا اعتراف رمزي.</div>
</div>`;

h+=`<div class="foot">Generated from <b>career/data.js</b> and <b>career/templates_detail.js</b> on the day it was opened —
  every label, question, gate line and definition above is the live string, not a paraphrase.<br>
  Full system: <b>hossamhj.github.io/idp-form/career/hub.html</b> &nbsp;·&nbsp; One-page summary: <b>/programme_onepager.html</b>
  &nbsp;·&nbsp; Print this with Ctrl+P.</div>`;

document.getElementById('sheet').innerHTML=h;
</script>
</body>
</html>
