<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Development Plan</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=20260907192756">
<style>
.shift{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:10px}
.shift-x{background:#fff;border:1px solid #D8D2F5;border-radius:8px;padding:7px 13px;font-size:12px;font-style:italic}
.ff{border:1px solid var(--line);border-radius:12px;margin-bottom:12px;overflow:hidden}
.ff-h{padding:12px 15px;background:#FCFBF9;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ff-n{font-size:13.5px;font-weight:600}
.ff-m{font-size:10.5px;color:var(--gray);margin-top:2px}
.steps{margin-left:auto;display:flex;gap:3px}
.st{font-size:9px;font-weight:600;padding:4px 8px;border-radius:6px;border:1px solid var(--line);background:#fff;color:var(--gray);cursor:pointer;font-family:inherit}
.st.on{background:#E1F5EE;border-color:var(--green);color:#085041}
.st{display:inline-flex;align-items:center;gap:5px}
.st b{font-size:8px;font-weight:700;background:#F2EFE9;color:#8A8780;border-radius:4px;padding:1px 4px}
.st.due{border-color:var(--amber);border-style:dashed}
.st.due b{background:#FEF6E7;color:#7A4A05}
.st.on b{background:rgba(8,80,65,.12);color:#085041}
.lag{font-size:9.5px;font-weight:600;background:#FDEEEA;color:#8A2E12;border-radius:8px;padding:3px 9px;white-space:nowrap}
.ff-b{padding:13px 15px;border-top:1px solid #F0EDE7}
.lg{border:1px solid #EDEAE4;border-radius:9px;padding:11px 13px;background:#FCFBF9;margin-bottom:7px}
.lg-d{font-size:9.5px;color:var(--gray);margin-bottom:6px}
.lg-r{display:grid;grid-template-columns:112px 1fr;gap:9px;margin-bottom:5px;font-size:12px;line-height:1.6}
.lg-r:last-child{margin:0}
.lg-k{color:var(--gray);font-size:10.5px}
.lg-r.key .lg-v{color:#085041;font-weight:600}
.form{border:1px dashed #D5D0C8;border-radius:10px;padding:12px 14px;background:#fff}
.form-t{font-size:10.5px;font-weight:600;color:#6A6760;margin-bottom:9px;letter-spacing:.04em;text-transform:uppercase}
.fld{margin-bottom:8px}
.fld label{display:block;font-size:10.5px;color:var(--gray);margin-bottom:4px}
.fld.key label{color:#085041;font-weight:600}
.fld textarea{width:100%;font-family:inherit;font-size:12.5px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;resize:vertical;min-height:36px;background:#FCFBF9;line-height:1.5}
.fld textarea:focus{outline:none;border-color:var(--green);background:#fff}
.btn{background:var(--green);color:#fff;border:none;font-family:inherit;font-size:12.5px;font-weight:600;padding:8px 18px;border-radius:8px;cursor:pointer}
.as{padding:11px 0;border-bottom:1px solid #F2EFE9}
.as:last-child{border:none}
.as-n{font-size:12.5px;font-weight:500}
.as-row{display:flex;gap:20px;margin-top:8px;align-items:flex-end;flex-wrap:wrap}
.as-c{flex:1;min-width:200px}
.as-l{font-size:9.5px;color:var(--gray);margin-bottom:4px}
.rate{display:flex;gap:3px}
.rb{flex:1;min-width:48px;height:25px;border:1px solid var(--line);background:#fff;border-radius:6px;cursor:pointer;font-size:9.5px;font-family:inherit;font-weight:500;color:#6A6760}
.rb.on{border-width:2px;font-weight:600}
.rb.on[data-v="1"]{background:#F5F3F0;border-color:#B5B0A8}
.rb.on[data-v="2"]{background:#FEF6E7;border-color:var(--amber);color:#7A4A05}
.rb.on[data-v="3"]{background:#E1F5EE;border-color:var(--green);color:#085041}
.rb.on[data-v="4"]{background:#EEEDFE;border-color:var(--purple);color:#26215C}
.gap{font-size:10px;font-weight:600;padding:3px 9px;border-radius:8px;align-self:center;white-space:nowrap}
.gt{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid #F2EFE9}
.gt:last-child{border:none}
.gt-n{font-size:12.5px;font-weight:600;min-width:150px}
.gt-n i{display:block;font-size:10.5px;font-weight:400;font-style:italic;color:var(--gray);margin-top:3px;line-height:1.5}
.gt-d{font-size:11.5px;color:var(--gray);line-height:1.6;flex:1}
.qtabs{display:flex;align-items:center;gap:6px;margin-bottom:11px;flex-wrap:wrap}
.qt{font-family:inherit;font-size:12px;font-weight:600;color:#6A6760;background:#fff;border:1px solid var(--line);
  border-radius:8px;padding:6px 13px;cursor:pointer;display:flex;align-items:center;gap:7px}
.qt:hover{background:#FCFBF9}
.qt.on{background:var(--navy);border-color:var(--navy);color:#fff}
.qt.future{opacity:.5}
.qt-c{font-size:9px;font-weight:600;background:#F2EFE9;color:#5A5750;border-radius:5px;padding:1px 5px}
.qt.on .qt-c{background:rgba(255,255,255,.2);color:#fff}
.qt-now{margin-left:auto;font-size:10.5px;color:var(--gray)}
.qnote{font-size:11.5px;color:#5A5750;background:#FCFBF9;border:1px solid #EDEAE4;border-radius:9px;
  padding:9px 13px;margin-bottom:13px;line-height:1.6}
.as-prev{font-size:10.5px;color:var(--gray);margin-top:7px;padding-top:7px;border-top:1px dashed #EDEAE4}
table.mx{width:100%;border-collapse:collapse;font-size:12px}
table.mx th{text-align:left;font-size:9px;letter-spacing:.09em;text-transform:uppercase;color:var(--gray);
  font-weight:600;padding:0 8px 8px 0;border-bottom:1px solid var(--line)}
table.mx td{padding:9px 8px 9px 0;border-bottom:1px solid #EFECE6;vertical-align:middle}
table.mx tr:last-child td{border:none}
.mx-n{font-weight:600;font-size:12px;white-space:nowrap}
.mx-c{font-size:9.5px;font-weight:600;padding:3px 8px;border-radius:7px;white-space:nowrap;display:inline-block}
.mx-e{color:#C8C2B8}
</style>
</head>
<body>

<div class="topnav">
  <div class="av" id="navAv" style="width:32px;height:32px;font-size:10px"></div>
  <div>
    <div class="nav-name" id="navName">—</div>
    <div class="nav-sub" id="navSub">Development Plan</div>
  </div>
  <div class="tabs">
    <button class="tab on" onclick="go('journey',this)">Journey</button>
    <button class="tab" onclick="go('now',this)">This Quarter</button>
    <button class="tab" onclick="go('assess',this)">Assessment</button>
    <button class="tab" onclick="go('gate',this)">The Gate</button>
    <button class="tab" onclick="go('coach',this)">Coaches</button>
  </div>
  <a href="hub.html" class="right">☰ All views</a>
</div>

<div class="wrap">
  <div id="hero"></div>
  <div class="view on" id="v-journey"><div id="journey"></div></div>
  <div class="view" id="v-now"><div id="now"></div></div>
  <div class="view" id="v-assess"><div id="assess"></div></div>
  <div class="view" id="v-gate"><div id="gate"></div></div>
  <div class="view" id="v-coach"><div id="coach"></div></div>
</div>
<div class="toast" id="toast"></div>

<script src="data.js?v=20260907192756"></script>
<script src="roster.js?v=20260907192756"></script>
<script src="owners.js?v=20260907192756"></script>
<script>
const POS=['RX Coordinator','RX Associate','Senior RX Associate','Assistant General Manager','General Manager'];
function teacherFor(f){ if(typeof FN_OWNER==='undefined')return null;
  const nm=String(f).replace('★ ','').replace(/ ([^)]*)$/,'');
  const oi=FN_OWNER[nm]; if(oi===undefined)return null;
  return oi<0?'no single owner — the coach carries it':POS[oi]; }
const x=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const EMP=new URLSearchParams(location.search).get('emp')||'beesan';

/* TEAM holds the richly-detailed people; ROSTER holds everyone.
   Anyone not in TEAM still gets a full page, derived from the roster. */
const COLBY={2:'#C8853A',3:'#7C5CBF',4:'#0D6E5C',5:'#1D3A8A'};
function resolve(id){
  if(TEAM[id]) return TEAM[id];
  const r=typeof ROSTER!=='undefined' && ROSTER.find(z=>z.id===id);
  if(!r) return null;
  const prop=PROPERTIES.find(p=>p.id===r.prop)||{};
  const coach=r.coach&&typeof ALL_COACHES!=='undefined'?ALL_COACHES[r.coach]:null;
  return {
    name:r.name, ini:r.name.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase(),
    color:COLBY[r.lvl]||'#8A8780', property:prop.name||'',
    role:r.role, template:r.target, state:r.state, quarter:r.quarter||0,
    manager:coach?coach.name:(prop.agm||prop.gm||'—'),
    sponsor:prop.gm||'—', gate:'—', teachers:null,
    note:'No programme has been activated yet. Record the join and role dates and run the mastery check in Admin — eligibility cannot be confirmed without them.'
  };
}
const P=resolve(EMP), T=P&&P.template?TEMPLATES[P.template]:null;
const K='cd_'+EMP+'_';
const ST={logs:JSON.parse(localStorage.getItem(K+'logs')||'{}'),step:JSON.parse(localStorage.getItem(K+'step')||'{}'),
  self:JSON.parse(localStorage.getItem(K+'self')||'{}'),mgr:JSON.parse(localStorage.getItem(K+'mgr')||'{}'),
  save(){['logs','step','self','mgr'].forEach(k=>localStorage.setItem(K+k,JSON.stringify(ST[k])))}};
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('on');clearTimeout(t._);t._=setTimeout(()=>t.classList.remove('on'),1700)}
var AQ=1;
const MON=+(localStorage.getItem('cd_month')||2);   /* month within the current quarter, 1-3 */
const STEPS=['observe','assisted','solo','owned'],STEPL={observe:'Observe',assisted:'With support',solo:'Alone',owned:'Owned'};

function go(v,btn){document.querySelectorAll('.view').forEach(e=>e.classList.remove('on'));
  document.getElementById('v-'+v).classList.add('on');
  document.querySelectorAll('button.tab').forEach(t=>t.classList.remove('on'));if(btn)btn.classList.add('on');window.scrollTo(0,0)}

if(!P||!T){document.getElementById('hero').innerHTML='<div class="sec"><div class="sec-t">Not found</div><div class="sec-s">No team member matches that link.</div></div>';}
else{
document.getElementById('navAv').textContent=P.ini;
document.getElementById('navAv').style.background=P.color;
document.getElementById('navName').textContent=P.name;
document.getElementById('navSub').textContent=T.code+' · '+P.role;

const s=STATE[P.state];
document.getElementById('hero').innerHTML=`
  <div class="hero">
    <div class="av" style="background:${P.color};width:48px;height:48px;font-size:14px">${P.ini}</div>
    <div><div class="hero-t">${x(T.from)} → ${x(T.to)}</div>
      <div class="hero-s">${x(T.kind)} · ${x(P.property)}</div></div>
    <div class="hero-m">
      <div><div class="hm-v">${T.changed}</div><div class="hm-l">Functions change</div></div>
      <div><div class="hm-v">${T.months} mo</div><div class="hm-l">Duration</div></div>
      <div><div class="hm-v">${P.quarter?'Q'+P.quarter:'—'}</div><div class="hm-l">Quarter</div></div>
      <div><div class="hm-v" style="font-size:13px">${x(P.gate)}</div><div class="hm-l">Gate</div></div>
    </div>
  </div>
  ${P.state==='blocked'?`<div class="alert crit"><div class="alert-i">■</div><div>
    <div class="alert-t">Blocked</div><div class="alert-b">${T.blocker||x(P.blockedBy)}</div></div></div>`:''}
  ${P.note?`<div class="alert info"><div class="alert-i">●</div><div><div class="alert-b">${x(P.note)}</div></div></div>`:''}`;

/* JOURNEY */
/* if the GM has held this person back, that is the first thing on the page */
const ADM=(JSON.parse(localStorage.getItem('cd_admin')||'{}').people||{})[EMP]||{};
const heldHTML = ADM.readiness==='not_ready' ? `
  <div class="alert"><div class="alert-i">▲</div><div>
    <div class="alert-t">Held back — the programme has not started</div>
    <div class="alert-b">
      ${(ADM.exceptions||[]).filter(Boolean).length?`<b>What is not there yet:</b><br>${(ADM.exceptions||[]).filter(Boolean).map(e=>'· '+x(e)).join('<br>')}<br><br>`:''}
      ${ADM.recommend?`<b>The next three months:</b> ${x(ADM.recommend)}<br>`:''}
      ${ADM.follower&&typeof ALL_COACHES!=='undefined'&&ALL_COACHES[ADM.follower]?`<b>Followed up by:</b> ${x(ALL_COACHES[ADM.follower].name)} · `:''}
      ${ADM.recheckDate?`<b>Recheck:</b> ${new Date(ADM.recheckDate).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'})}`:''}
      ${(ADM.deferrals|0)>=3?'<br><br><b>This is the third hold-back.</b> A fourth is not a deferral. The GM owes either a real plan or an honest conversation.':''}
    </div></div></div>` : '';

document.getElementById('journey').innerHTML=heldHTML+`
  <div class="sec">
    <div class="sec-t">The shift this transition is about</div>
    <div class="sec-s">${x(T.essence)} — ${x(T.startState)}</div>
    <div class="shift">
      <span class="shift-x">"${x(T.valueShift[0])}"</span>
      <span style="color:var(--purple);font-size:15px">→</span>
      <span class="shift-x" style="border-color:var(--purple);font-weight:500">"${x(T.valueShift[1])}"</span>
    </div>
    <div class="card" style="margin-top:12px"><div class="card-b">A skill is built by practice. A value only changes through a deliberate conversation — someone whose value has not changed reverts under the first real pressure.</div></div>
  </div>
  <div class="sec">
    <div class="sec-t">The ${T.months}-month journey</div>
    <div class="sec-s">One goal per quarter. Three functions at a time — the rest progress naturally and are verified at the gate.</div>
    ${T.quarters.map(q=>{
      const st=q.n<P.quarter?'done':q.n===P.quarter?'now':'next';
      const col=st==='done'?'background:#EAF7F2;color:#0A5540':st==='now'?'background:var(--green);color:#fff':'background:#F2EFE9;color:#8A8780';
      const bd={done:['Complete','background:#EAF7F2;color:#0A5540'],now:['In progress','background:#FEF6E7;color:#7A4A05'],next:['Ahead','background:#F2EFE9;color:#5A5750']}[st];
      return `<div class="q ${st} ${st==='now'?'open':''}" id="jq${q.n}">
        <div class="q-h" onclick="document.getElementById('jq${q.n}').classList.toggle('open')">
          <div class="q-tag" style="${col}">Q${q.n}</div>
          <div><div class="q-goal">${x(q.goal)}</div><div class="q-when">${x(q.period)}</div></div>
          <span class="q-badge" style="${bd[1]}">${bd[0]}</span>
          <span class="q-chev">▾</span></div>
        <div class="q-b">
          ${q.fns.length?`<div class="q-lbl">In focus this quarter</div>
            <div class="q-fn">${q.fns.map(f=>`<span class="q-chip">${x(f)}</span>`).join('')}</div>`:''}
          ${q.why?`<div class="q-why">${x(q.why)}</div>`:''}
          <div class="q-lbl">Month by month</div>
          ${q.months.map((m,i)=>`<div class="mo"><span class="mo-m">M${i+1}</span><span class="mo-t">${m}</span></div>`).join('')}
          <div class="mile">${x(q.milestone)}</div>
        </div></div>`;}).join('')}
  </div>`;

/* THIS QUARTER */
const cq=T.quarters.find(q=>q.n===P.quarter);
document.getElementById('now').innerHTML=cq&&cq.fns.length?`
  <div class="sec">
    <div class="sec-t">Q${cq.n} — "${x(cq.goal)}"</div>
    <div class="sec-s">${x(cq.why||cq.period)}</div>
    ${cq.fns.map((f,i)=>{
      const id='q'+cq.n+'_f'+i, old='f'+i;
      const cur=ST.step[id]||ST.step[old]||'observe', logs=ST.logs[id]||ST.logs[old]||[];
      const teach=teacherFor(f)||(P.teachers&&P.teachers[f])||'the function owner';
      /* where the plan says this function should be by the month we are in */
      const KEY={o:0,a:1,s:2,w:3};
      const col = cq.plan ? cq.plan.slice(0,MON).map(r=>KEY[r[i]]).filter(v=>v!==undefined) : [];
      const due = col.length ? Math.max(...col) : -1;
      const now = STEPS.indexOf(cur);
      const behind = due>=0 && now<due;
      return `<div class="ff">
        <div class="ff-h"><div><div class="ff-n">${x(f)}</div>
            <div class="ff-m">taught by ${x(teach)}${due>=0?` · plan says <b>${STEPL[STEPS[due]]}</b> by month ${(cq.n-1)*3+MON}`:''}</div></div>
          ${behind?`<span class="lag">Behind by ${due-now} step${due-now>1?'s':''}</span>`:''}
          <div class="steps">${STEPS.map((s,si)=>{
            const first=cq.plan?cq.plan.map(r=>KEY[r[i]]).indexOf(si):-1;
            return `<button class="st ${cur===s?'on':''} ${si===due?'due':''}" onclick="setStep('${id}','${s}')" title="${first>=0?'planned for month '+((cq.n-1)*3+first+1):''}">${STEPL[s]}${first>=0?`<b>M${(cq.n-1)*3+first+1}</b>`:''}</button>`;}).join('')}</div></div>
        <div class="ff-b">
          ${logs.length?logs.map(l=>`<div class="lg"><div class="lg-d">${x(l.d)}</div>
            <div class="lg-r"><span class="lg-k">What did I try?</span><span class="lg-v">${x(l.a)}</span></div>
            ${l.o?`<div class="lg-r"><span class="lg-k">What happened?</span><span class="lg-v">${x(l.o)}</span></div>`:''}
            ${l.w?`<div class="lg-r key"><span class="lg-k">What would I do differently?</span><span class="lg-v">${x(l.w)}</span></div>`:''}
            ${l.nd?`<div class="lg-r"><span class="lg-k">What do I need?</span><span class="lg-v">${x(l.nd)}</span></div>`:''}</div>`).join('')
            :'<div style="font-size:11.5px;color:var(--gray);font-style:italic;padding:8px 0">No practice entries yet. The log is what makes this development rather than a checklist.</div>'}
          <div class="form"><div class="form-t">Add a practice entry — in your own words</div>
            <div class="fld"><label>What did I try?</label><textarea id="a-${id}"></textarea></div>
            <div class="fld"><label>What happened?</label><textarea id="o-${id}"></textarea></div>
            <div class="fld key"><label>What would I do differently?</label><textarea id="w-${id}"></textarea></div>
            <div class="fld"><label>What do I need?</label><textarea id="n-${id}"></textarea></div>
            <button class="btn" onclick="addLog('${id}')">Save entry</button></div>
        </div></div>`;}).join('')}
  </div>
  <div class="sec">
    <div class="sec-t">Stretch assignment</div>
    <div class="sec-s">Real scope with real stakes. Without genuine risk this gate is paperwork.</div>
    <div class="card" style="background:#FEF6E7;border-color:#F0C674">
      <div class="card-b"><b>${x(T.stretch.what)}</b></div></div>
    <div class="cols c2" style="margin-top:12px">
      <div class="card"><div class="card-k" style="color:#0A5540">Acceptable</div><div class="card-b">${x(T.stretch.ok)}</div></div>
      <div class="card"><div class="card-k" style="color:#8A2E12">Intervene</div><div class="card-b">${x(T.stretch.stop)}</div></div>
    </div>
    <div class="card" style="margin-top:12px;background:#EEEDFE;border-color:#D8D2F5">
      <div class="card-b" style="color:#3A3160"><b>Failure with clear reflection does not fail the gate.</b> Repeated failure without learning does.</div></div>
  </div>`
  : (cq&&cq.observation)?(()=>{const O=cq.observation, oid='q'+cq.n+'_obs', logs=ST.logs[oid]||[];
      return `<div class="sec">
    <div class="sec-t">Q${cq.n} — "${x(cq.goal)}"</div>
    <div class="sec-s">${x(O.why)}</div>
    <div class="ff">
      <div class="ff-h"><div><div class="ff-n">${x(O.title)}</div>
        <div class="ff-m">no function to stand in front of yet — watching is the work</div></div></div>
      <div class="ff-b">
        ${logs.length?logs.map(l=>`<div class="lg"><div class="lg-d">${x(l.d)}</div>
          ${O.fields.map(f=>l[f[0]==='a'?'a':f[0]==='o'?'o':f[0]==='w'?'w':'nd']?
            `<div class="lg-r ${f[0]==='w'?'key':''}"><span class="lg-k">${x(f[1])}</span><span class="lg-v">${x(l[f[0]==='n'?'nd':f[0]])}</span></div>`:'').join('')}
          </div>`).join('')
          :`<div class="exmp" style="border:1px solid #B7E3D3;background:#F5FBF9;border-radius:11px;padding:13px 15px;margin-bottom:13px">
             <div style="font-size:9.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#0A5540;margin-bottom:9px">An example of a real entry</div>
             ${O.fields.map(f=>`<div class="lg-r ${f[0]==='w'?'key':''}" style="grid-template-columns:150px 1fr">
               <span class="lg-k">${x(f[1])}</span><span class="lg-v">${O.example[f[0]]}</span></div>`).join('')}
             <div style="font-size:10.5px;color:#5A7A70;margin-top:10px;padding-top:9px;border-top:1px dashed #DDF0E8;line-height:1.7">${x(O.note)}</div>
           </div>`}
        <div class="form"><div class="form-t">Add an observation entry — in your own words</div>
          ${O.fields.map(f=>`<div class="fld ${f[0]==='w'?'key':''}">
            <label>${x(f[1])}</label><textarea id="${f[0]}-${oid}" placeholder="${x(f[2]||'')}"></textarea></div>`).join('')}
          <button class="btn" onclick="addLog('${oid}')">Save entry</button></div>
      </div></div>
    <div class="mile" style="margin-top:14px">${x(cq.milestone)}</div>
  </div>`;})()
  :`<div class="sec"><div class="sec-t">Not in an active quarter</div>
    <div class="sec-s">${P.state==='blocked'?'This programme is blocked — see the note above.':P.state==='eligible'?'Eligible to start. Eligibility must be confirmed first.':'No deliberate functions in this quarter.'}</div>
    <div class="q-lbl" style="margin-top:14px">Eligibility — all must be true</div>
    <ul class="tight">${T.eligibility.map(e=>`<li>${e}</li>`).join('')}</ul></div>`;

/* ASSESSMENT — one per quarter, so progress is visible instead of overwritten */
const dims=BEHAVIOURS.filter(b=>!b.fromLevel||T.level>=b.fromLevel);
const QN=T.quarters.map(q=>q.n);
AQ=P.quarter||1;
const val=(who,q,id)=>ST[who][q+'_'+id]||0;
const SL={1:['Not yet','#F5F3F0','#8A8780'],2:['Sometimes','#FEF6E7','#7A4A05'],
          3:['Every time','#E1F5EE','#085041'],4:['Teaches','#EEEDFE','#26215C']};

function renderAssess(){
  const q=T.quarters.find(z=>z.n===AQ)||T.quarters[0];
  const done=dims.filter(b=>val('self',AQ,b.id)&&val('mgr',AQ,b.id)).length;

  document.getElementById('assess').innerHTML=`
    <div class="sec">
      <div class="sec-t">Behaviour — rated once each quarter</div>
      <div class="sec-s">Five dimensions, not thirty. Rate yourself <b>before</b> seeing the manager's rating — the conversation starts from the gap. <b>Every time</b> is the gate standard, and the real test is always under pressure.</div>
      <div class="qtabs">
        ${QN.map(n=>{const c=dims.filter(b=>val('self',n,b.id)&&val('mgr',n,b.id)).length;
          return `<button class="qt ${n===AQ?'on':''} ${n>P.quarter?'future':''}" onclick="setAQ(${n})">Q${n}
            <span class="qt-c">${c===dims.length?'✓':c+'/'+dims.length}</span></button>`;}).join('')}
        <span class="qt-now">Currently in <b>Q${P.quarter}</b></span>
      </div>
      <div class="qnote">Q${AQ} — <b>${x(q.goal)}</b> · ${x(q.period)}${AQ>P.quarter?' · <span style="color:#7A4A05">not reached yet</span>':''}${done===dims.length?' · <span style="color:#085041">complete</span>':''}</div>

      ${dims.map(b=>{
        const sv=val('self',AQ,b.id), mv=val('mgr',AQ,b.id);
        let g='';
        if(sv&&mv){const d=sv-mv;
          g=d===0?`<span class="gap" style="background:#EAF7F2;color:#085041">Aligned</span>`
           :`<span class="gap" style="background:${Math.abs(d)>1?'#FDEEEA':'#FEF6E7'};color:${Math.abs(d)>1?'#8A2E12':'#7A4A05'}">${d>0?'Self higher':'Self lower'} · ${Math.abs(d)}</span>`;}
        const r=(who,v)=>`<div class="rate">${SCALE.map(o=>`<button class="rb ${v===o.v?'on':''}" data-v="${o.v}" title="${x(o.d||'')}" onclick="setR('${who}','${b.id}',${o.v})">${o.l}</button>`).join('')}</div>`;
        const prev=QN.filter(n=>n<AQ&&val('mgr',n,b.id)).map(n=>`Q${n} ${SL[val('mgr',n,b.id)][0]}`).join(' → ');
        return `<div class="as"><div class="as-n">${x(b.n)}</div>
          <div class="as-row"><div class="as-c"><div class="as-l">${x(P.name.split(' ')[0])} — self</div>${r('self',sv)}</div>
          <div class="as-c"><div class="as-l">${x(P.manager.split(' ')[0])} — manager</div>${r('mgr',mv)}</div>${g}</div>
          ${prev?`<div class="as-prev">${prev}${mv?' → <b>Q'+AQ+' '+SL[mv][0]+'</b>':''}</div>`:''}</div>`;
      }).join('')}
    </div>

    <div class="sec">
      <div class="sec-t">The whole year at a glance</div>
      <div class="sec-s">The manager's rating each quarter. This is the only place the direction of travel shows — a dimension that never moves is the finding.</div>
      <table class="mx"><thead><tr><th></th>${QN.map(n=>`<th>Q${n}</th>`).join('')}<th>Movement</th></tr></thead>
        <tbody>${dims.map(b=>{
          const vs=QN.map(n=>val('mgr',n,b.id));
          const first=vs.find(v=>v), last=[...vs].reverse().find(v=>v);
          const mv=(first&&last)?(last-first):null;
          return `<tr><td class="mx-n">${x(b.n)}</td>
            ${vs.map((v,i)=>`<td>${v?`<span class="mx-c" style="background:${SL[v][1]};color:${SL[v][2]}">${SL[v][0]}</span>`
              :`<span class="mx-e">—</span>`}</td>`).join('')}
            <td>${mv===null?'<span class="mx-e">—</span>':mv>0?`<span class="mx-c" style="background:#E1F5EE;color:#085041">+${mv}</span>`
              :mv<0?`<span class="mx-c" style="background:#FDEEEA;color:#8A2E12">${mv}</span>`
              :'<span class="mx-c" style="background:#FEF6E7;color:#7A4A05">flat</span>'}</td></tr>`;
        }).join('')}</tbody></table>
      <div class="card" style="margin-top:12px"><div class="card-b">The gate asks for <b>Every time on all ${dims.length}</b>, from three sources. One dimension short is a specific finding, not an average.</div></div>
    </div>

    <div class="sec">
      <div class="sec-t">Monthly conversation</div>
      <div class="sec-s">45 minutes with ${x(P.manager)}, every month of the programme. The same four questions each time — their power is in the repetition. Does not begin with "how are things going?"</div>
      <ul class="tight">${T.questions.map(q=>`<li>${q}</li>`).join('')}</ul>
      <div class="card" style="margin-top:12px"><div class="card-b">Ends with <b>one specific commitment</b> for the coming month — not a list.</div></div>
    </div>`;
}
function setAQ(n){AQ=n;renderAssess();}
renderAssess();

/* GATE */
document.getElementById('gate').innerHTML=`
  <div class="sec">
    <div class="sec-t">Five gates — all of them, no averaging</div>
    <div class="sec-s">Strong on one and weak on another is a specific, actionable finding. An average erases it.</div>
    ${T.gates.map(g=>{const D=(typeof DIMENSIONS!=='undefined'&&DIMENSIONS[g[0]])||null;return `<div class="gt"><span class="gt-n">${x(g[0])}${D?`<i>${x(D.q)}</i>`:''}</span><span class="gt-d">${g[1]}</span>
      <span class="chip" style="background:#F2EFE9;color:#5A5750">Not yet</span></div>`;}).join('')}
  </div>
  <div class="sec">
    <div class="sec-t">Fail rule</div>
    <div class="card" style="background:#FDEEEA;border-color:#EFB5A2">
      <div class="card-b" style="color:#5A3128">${x(T.failRule)}</div></div>
  </div>
  <div class="sec">
    <div class="sec-t">External training</div>
    <div class="sec-s">Bought only where the capability does not exist internally. <b>No course without a planned application within 30 days.</b></div>
    ${T.external.map(e=>`<div class="row"><span class="row-k">Q${e.q}</span>
      <div style="flex:1"><b>${x(e.c)}</b><div style="font-size:11.5px;color:var(--gray);margin-top:2px">${x(e.why)}</div></div></div>`).join('')}
  </div>`;

/* COACHES */
document.getElementById('coach').innerHTML=`
  <div class="sec">
    <div class="sec-t">${x(T.agm.label||'AGM — direct coach')} · ${x(P.manager)}</div>
    <div class="sec-s">Commitment: roughly <b>${T.agm.hours} hours a month</b>. Reads the practice log before each session.</div>
    <ul class="tight">${T.agm.acts.map(a=>`<li>${a}</li>`).join('')}</ul>
    <div class="card" style="margin-top:12px;background:#FEF6E7;border-color:#F0C674">
      <div class="card-b" style="color:#6B4A15"><b>The coach asks and challenges — never fills in the log.</b> A plan its owner does not write is not their plan.</div></div>
  </div>
  <div class="sec">
    <div class="sec-t">${x(T.gm.label||'GM — sponsor')} · ${x(P.sponsor)}</div>
    <div class="sec-s">Commitment: roughly <b>${T.gm.hours} hours a month</b>. Grants the level at the gate.</div>
    <ul class="tight">${T.gm.acts.map(a=>`<li>${a}</li>`).join('')}</ul>
  </div>
  <div class="sec">
    <div class="sec-t">Who teaches what</div>
    <div class="sec-s">Development is distributed by dimension — not all loaded onto the manager.</div>
    <div class="row"><span class="dot" style="background:var(--green)"></span><div style="flex:1"><b>Craft</b> — whoever owns the function, usually a peer one level up. Around 70% of the volume.</div></div>
    <div class="row"><span class="dot" style="background:var(--teal)"></span><div style="flex:1"><b>Conduct</b> — the line manager, who sees them daily under pressure.</div></div>
    <div class="row"><span class="dot" style="background:var(--purple)"></span><div style="flex:1"><b>Scope</b> — the sponsor, who has the authority to grant real scope.</div></div>
  </div>`;
}

function setStep(id,s){ST.step[id]=s;ST.save();location.reload()}
function setR(who,id,v){ST[who][AQ+'_'+id]=v;ST.save();renderAssess();toast('Saved to Q'+AQ)}
function addLog(id){
  const g=p=>{const e=document.getElementById(p+'-'+id);return e?e.value.trim():''};
  const a=g('a'); if(!a){toast('Start with what you tried');return}
  if(!ST.logs[id])ST.logs[id]=[];
  ST.logs[id].unshift({d:new Date().toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}),a,o:g('o'),w:g('w'),nd:g('n')});
  ST.save();location.reload();
}
</script>
</body>
</html>
